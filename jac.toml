[project]
name = "promptzero"
version = "0.1.0"
description = "A context compiler with inspectable Jac intent graphs"
entry-point = "main.jac"
jac-version = "0.16.7"
requires-python = ">=3.12"

[dependencies]
fastapi = "==0.141.1"
uvicorn = "==0.54.0"
python-multipart = "==0.0.32"
pypdf = "==6.19.0"
markitdown = "==0.1.8"

[dev-dependencies]
httpx = "==0.28.1"

[scripts]
start = "jac run main.jac"
test = "jac test compiler_tests.jac -v"

[test]
verbose = true
